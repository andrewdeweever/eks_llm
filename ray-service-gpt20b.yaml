apiVersion: ray.io/v1
kind: RayService
metadata:
  name: gpt-oss-20b
spec:
  serveConfigV2: |
    applications:
    - name: llm
      import_path: ray.serve.llm:build_openai_app
      route_prefix: "/"
      args:
        llm_configs:
        - model_loading_config:
            model_id: "gpt-oss-20b"
            model_source: "openai/gpt-oss-20b"
          accelerator_type: "L4"                  
          deployment_config:
            autoscaling_config:
              min_replicas: 1
              max_replicas: 1
            max_ongoing_requests: 128
          engine_kwargs:
            tensor_parallel_size: 1              
            pipeline_parallel_size: 3            
            gpu_memory_utilization: 0.90
            dtype: "bfloat16"
            max_model_len: 8192                   
            max_num_seqs: 256
            enable_chunked_prefill: true
            enable_prefix_caching: true
  rayClusterConfig:
    rayVersion: "2.52.0"                         
    headGroupSpec:
      rayStartParams:
        num-gpus: "0"
      template:
        spec:
          containers:
          - name: ray-head
            image: rayproject/ray-llm:2.52.0-py311-cu128  
            resources:
              limits:
                cpu: "2"
                memory: "8Gi"
              requests:
                cpu: "1"
                memory: "4Gi"
            ports:
            - containerPort: 8000
              name: serve
            - containerPort: 8265
              name: dashboard
              
    workerGroupSpecs:
    - groupName: gpu-group
      replicas: 3                               
      minReplicas: 3
      maxReplicas: 3
      rayStartParams:
        num-gpus: "1"
      template:
        spec:
          containers:
          - name: ray-worker
            image: rayproject/ray-llm:2.52.0-py311-cu128
            env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: hf_token
            resources:
              limits:
                cpu: "4"
                memory: "16Gi"
                nvidia.com/gpu: "1"
              requests:
                cpu: "4"
                memory: "16Gi"
                nvidia.com/gpu: "1"
            # Optional but recommended for vLLM/NCCL
            volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          tolerations:
          - key: "nvidia.com/gpu"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"            
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 20Gi