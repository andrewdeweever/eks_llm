apiVersion: ray.io/v1
kind: RayService
metadata:
  name: ray-neuron-llama-70b-pp3
spec:
  serveConfigV2: |
    applications:
    - name: llama-70b
      import_path: ray.serve.llm:build_openai_app
      route_prefix: /v1/llama
      args:
        llm_configs:
        - model_loading_config:
            model_id: llama-3.3-70b
            model_source: meta-llama/Llama-3.3-70B-Instruct
            accelerator_type: aws-neuron-core
          engine_kwargs:
            dtype: bfloat16
            max_model_len: 8192
            tensor_parallel_size: 2
            pipeline_parallel_size: 3
            distributed_executor_backend: "ray"
            max_num_seqs: 16
          deployment_config:
            autoscaling_config:
              min_replicas: 0
              max_replicas: 1
              target_ongoing_requests: 8
            max_ongoing_requests: 32
  rayClusterConfig:
    rayVersion: "2.54.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "2"
      template:
        spec:
          containers:
          - name: ray-head
            image: public.ecr.aws/r0g5z1n1/my-public-repo:latest
            imagePullPolicy: Always
            resources:
              requests:
                cpu: "2"
                memory: "8Gi"
              limits:
                cpu: "2"
                memory: "8Gi"
            ports:
            - containerPort: 6379
              name: gcs-server
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8000
              name: serve                
          tolerations:
          - key: aws.amazon.com/neuron
            operator: Equal
            value: "true"
            effect: NoSchedule
    workerGroupSpecs:
    - groupName: neuron-workers
      replicas: 0
      minReplicas: 0
      maxReplicas: 3
      rayStartParams:
        num-cpus: "4"
      template:
        spec:
          containers:
          - name: ray-worker
            image: public.ecr.aws/r0g5z1n1/my-public-repo:latest
            imagePullPolicy: Always
            env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: hf_token
            resources:
              requests:
                cpu: "4"
                memory: "16Gi"
                aws.amazon.com/neuroncore: 2
              limits:
                cpu: "4"
                memory: "16Gi"
                aws.amazon.com/neuroncore: 2
          tolerations:
          - key: aws.amazon.com/neuron
            operator: Equal
            value: "true"
            effect: NoSchedule